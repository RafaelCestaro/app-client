<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jornada do Craque - Rafael Cestaro (SBFC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --color-primary: #009E60; /* São Bernardo Green */
        --bg-image: none;
        --bg-opacity: 1;
      }
      
      /* Utilitário para esconder a barra de rolagem mas permitir scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Animações globais */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out forwards;
      }
      .animate-fade-in {
        animation: fadeInUp 0.5s ease-out forwards;
      }
      
      /* Ajuste para Safe Area em iPhones novos */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Background Personalizado */
      .app-background {
        background-image: var(--bg-image);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'loco-red': 'var(--color-primary)', // Mantive o nome da classe mas a var agora é verde
              'loco-black': '#111111',
              'loco-gray': '#1f1f1f',
              'loco-gray-light': '#2a2a2a',
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white dark:bg-loco-black selection:bg-loco-red selection:text-white app-background">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
